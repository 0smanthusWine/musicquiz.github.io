<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Музыкальная викторина</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game-container" id="app">
  <div class="header">
    <div class="header-left">
      <div class="score-box">🏆 <span id="scoreDisplay">0</span></div>
      <button class="music-btn muted" id="musicBtn" title="Включить/выключить музыку">🔇</button>
    </div>
    <div class="header-right">
      <div class="question-counter">
        <span id="currentQuestionNum">1</span>/<span id="totalQuestionsNum">20</span>
        <span class="theme-badge" id="themeBadge">🎵</span>
        <span class="timer-compact hidden" id="timerCompact">
          <span class="icon">⏱</span>
          <span id="timerValue">20</span>с
        </span>
      </div>
    </div>
  </div>

  <div class="menu-screen active" id="menuScreen">
    <div class="menu-title">Музыкальная викторина</div>
    <div class="menu-subtitle">Выберите тему:</div>
    <div class="theme-buttons">
      <button class="theme-btn all" data-theme="all">
        <span class="icon">🎶</span> Все жанры
      </button>
      <button class="theme-btn pop" data-theme="pop">
        <span class="icon">🎤</span> Поп-музыка
      </button>
      <button class="theme-btn rock" data-theme="rock">
        <span class="icon">🎸</span> Рок-музыка
      </button>
      <button class="theme-btn rap" data-theme="rap">
        <span class="icon">🎧</span> Рэп и хип-хоп
      </button>
    </div>
  </div>

  <div class="game-screen" id="gameScreen">
    <div class="question-wrapper">
      <img class="question-image" id="questionImage" src="" alt="Изображение к вопросу" style="display:none;">
      <div class="question-text" id="questionText">Загрузка...</div>
    </div>

    <div class="options-grid" id="optionsGrid">
      <button class="option-btn" data-index="0">—</button>
      <button class="option-btn" data-index="1">—</button>
      <button class="option-btn" data-index="2">—</button>
      <button class="option-btn" data-index="3">—</button>
    </div>

    <div class="message-box" id="messageBox">Выберите один из вариантов</div>

    <div class="action-area">
      <div class="next-row">
        <button class="btn btn-success" id="nextBtn">▶ Следующий</button>
      </div>
      <div class="action-row">
        <button class="btn btn-secondary" id="menuBtn">📋 Меню</button>
        <button class="btn btn-danger" id="restartBtn">🔄 Заново</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <div class="modal-icon">⚠️</div>
      <div class="modal-title">Выйти в меню?</div>
      <div class="modal-text">
        При выходе в меню ваш текущий прогресс будет <span class="highlight">потерян</span>.<br>
        Вы уверены, что хотите покинуть игру?
      </div>
      <div class="modal-buttons">
        <button class="btn btn-success" id="modalContinueBtn">Продолжить</button>
        <button class="btn btn-warning" id="modalConfirmBtn">Выйти в меню</button>
      </div>
    </div>
  </div>
</div>

<script src="questions.js"></script>
<script src="script.js"></script>
</body>
</html>
